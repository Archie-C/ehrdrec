[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ehrdrec"
version = "0.1.0"
description = "A unified framework for ehr-based drug recommendation"
readme = "README.md"
authors = [{name = "Archie Carpenter", email = "archie_l_carpenter@hotmail.com"}]
requires-python = ">=3.12"

# These are the libraries people get when they 'pip install' your package
dependencies = [
    "einops>=0.8.2",
    "optuna>=4.9.0",
    "platformdirs>=4.10.0",
    "polars>=1.41.2",
    "pydantic>=2.13.4",
    "torch~=2.11.0",
    "tqdm>=4.68.2",
]

# Classification helps people find your package by category
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

# TensorBoardLogger imports this lazily; not needed unless you use it.
[project.optional-dependencies]
tensorboard = ["tensorboard>=2.18.0"]
